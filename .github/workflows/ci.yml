name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Lint y build (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  functions:
    name: Sintaxis Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Chequear sintaxis de las funciones
        run: |
          for f in supabase/functions/*/index.js; do
            echo "check $f"
            deno check --node-modules-dir=none "$f"
          done
      - name: Pruebas unitarias de helpers (HU-01 y HU-04)
        run: deno test --node-modules-dir=none supabase/functions/
