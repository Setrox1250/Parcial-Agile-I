# Configuración del proyecto Supabase (Supabase CLI)
# Documentación: https://supabase.com/docs/guides/local-development/cli/config

project_id = "parcial-agile"

# Edge Functions: supabase/functions/<nombre>/index.js
# Por defecto el CLI exige JWT (verify_jwt = true); se excepciona solo lo público.

[functions.health]
verify_jwt = false
entrypoint = './functions/health/index.js'

[functions.dni-lookup]
verify_jwt = true
entrypoint = './functions/dni-lookup/index.js'

[functions.elegibilidad]
verify_jwt = true
entrypoint = './functions/elegibilidad/index.js'

[functions.prestamos]
verify_jwt = true
entrypoint = './functions/prestamos/index.js'

[functions.quien-soy]
verify_jwt = true
entrypoint = './functions/quien-soy/index.js'

[functions.usuarios]
verify_jwt = true
entrypoint = './functions/usuarios/index.js'

[functions.ruc-lookup]
verify_jwt = true
entrypoint = './functions/ruc-lookup/index.js'

[functions.desembolso]
verify_jwt = true
entrypoint = './functions/desembolso/index.js'

